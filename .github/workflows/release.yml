name: Python uv Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write  # required for GitHub Release
  id-token: write  # required for PyPI Trusted Publishing
  actions: write   # required for tag deletion
  discussions: write  # attach the release-linked repo Discussion (Announcements)

jobs:
  # Exercises the `python_version < '3.11'` half of the dependency matrix (ray==2.0.0,
  # the older jedi/networkx/pydantic/typer pins). The release job below runs on 3.12,
  # where the framework integration tests can install -- on 3.10 ray==2.0.0 pins
  # click<=8.0.4 against celery>=5.3's click>=8.1.2 floor, so those test deps are
  # gated >=3.11 and would silently `importorskip` here. Gating the release on this
  # job keeps both halves of the matrix covered (#27).
  compat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        id: py310
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest
        env:
          # The venv-building CLI tests must find a base interpreter that can
          # create virtual environments; inside uv's own venv the discovery
          # walk has no anchor on the runner, so hand it the setup-python one.
          # Must be an absolute path — the override is checked with
          # Path(...).exists(), which never searches PATH.
          SYSTEM_PYTHON: ${{ steps.py310.outputs.python-path }}

  release:
    needs: compat
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # 3.12, not 3.10: the framework integration tests (#27) need flask/fastapi/
      # celery/click, which are gated `python_version >= '3.11'`. On 3.10 they
      # `importorskip` and the decorator-rule regression they exist to catch would
      # ship green. The `compat` job above keeps 3.10 covered.
      - name: Set up Python 3.12
        id: py312
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync --all-groups
      
      - name: Install dependencies
        run: uv pip install -e ".[neo4j]"

      # Keep generated docs in lockstep with the code being released: regenerate the
      # README `canpy --help` block and the Neo4j schema.json from source, and commit
      # them back to main. Releases are cut from main HEAD, so this fast-forwards;
      # best-effort if main moved.
      - name: Sync generated docs (README --help + Neo4j schema)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          uv run python scripts/update_readme.py
          uv run canpy --emit schema > schema.neo4j.json
          if git diff --quiet README.md schema.neo4j.json; then
            echo "Generated docs already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md schema.neo4j.json
            git commit -m "docs: sync README --help and Neo4j schema for ${GITHUB_REF#refs/tags/}"
            git push origin HEAD:main || echo "::warning::could not push doc sync to main (diverged?)"
          fi

      - name: Run tests
        id: test
        continue-on-error: true
        run: uv run pytest
        env:
          # Same reason as the `compat` job above, and it has to be repeated per job:
          # the venv-building CLI tests must find a base interpreter that can create
          # virtual environments, and inside uv's own venv the discovery walk has no
          # anchor on the runner. Must be this job's own setup step -- `steps.py310`
          # belongs to `compat` and would expand to an empty string here. Must be an
          # absolute path, because the override is checked with `Path(...).exists()`
          # and never searches PATH.
          SYSTEM_PYTHON: ${{ steps.py312.outputs.python-path }}

      # MUST be `outcome`, not `conclusion`: continue-on-error rewrites `conclusion` to
      # `success`, so a `conclusion == 'failure'` guard never fires and a red test run
      # publishes anyway. codeanalyzer-typescript 1.5.1 shipped that way.
      - name: Delete tag on failure
        if: steps.test.outcome == 'failure'
        run: |
          echo "Tests failed. Deleting tag ${GITHUB_REF#refs/tags/}..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git push --delete origin ${GITHUB_REF#refs/tags/}
          exit 1

      - name: Build package
        run: uv build

      # Platform-independent, version-locked release assets published alongside the
      # wheels/sdist: the Neo4j schema contract (so a consumer can validate
      # producer/consumer compatibility without installing the package), the
      # same contract's DDL as runnable Cypher, and the cargo-dist-style
      # install script.
      - name: Stage release assets (Neo4j schema + installer script)
        run: |
          mkdir -p release-assets
          uv run canpy --emit schema > release-assets/schema.json
          uv run python -c "from codeanalyzer.neo4j.schema import uniqueness_constraints, INDEXES; print('\n'.join(s + ';' for s in uniqueness_constraints() + INDEXES))" > release-assets/schema.cypher
          cp packaging/install/canpy-installer.sh release-assets/canpy-installer.sh
          tar -czf release-assets/analyzing-canpy-graphs-skill.tar.gz -C docs/skills analyzing-canpy-graphs
          cp docs/skills/analyzing-canpy-graphs/SKILL.md release-assets/analyzing-canpy-graphs-SKILL.md
          ls -lh release-assets

      - name: Get version from tag
        id: tag_name
        run: |
          echo "current_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        shell: bash

      # cargo-dist-style notes: install one-liners + a download table. The categorized
      # "What's Changed" (merged PRs/issues grouped under emoji headings via
      # .github/release.yml) is appended by generate_release_notes below. Indented code
      # blocks avoid backticks in the heredoc.
      - name: Compose release notes header (install + download)
        env:
          VERSION: ${{ steps.tag_name.outputs.current_version }}
        run: |
          REPO="codellm-devkit/codeanalyzer-python"
          BASE="https://github.com/$REPO/releases/download/v$VERSION"
          cat > "$RUNNER_TEMP/RELEASE_BODY.md" <<EOF
          ## Install codeanalyzer-python v$VERSION

          Shell script (installs the canpy CLI via uv / pipx / pip):

              curl --proto '=https' --tlsv1.2 -LsSf https://github.com/$REPO/releases/latest/download/canpy-installer.sh | sh

          PyPI:

              pip install codeanalyzer-python==$VERSION

          For the optional live Neo4j push (--emit neo4j --neo4j-uri ...):

              pip install 'codeanalyzer-python[neo4j]==$VERSION'

          ## Download

          | File | Description |
          | --- | --- |
          | [codeanalyzer_python-$VERSION-py3-none-any.whl]($BASE/codeanalyzer_python-$VERSION-py3-none-any.whl) | Python wheel |
          | [codeanalyzer_python-$VERSION.tar.gz]($BASE/codeanalyzer_python-$VERSION.tar.gz) | Source distribution |
          | [canpy-installer.sh]($BASE/canpy-installer.sh) | Shell installer (uv / pipx / pip) |
          | [schema.json]($BASE/schema.json) | Neo4j schema contract |
          EOF
          echo "----- composed header -----"; cat "$RUNNER_TEMP/RELEASE_BODY.md"

      - name: Publish release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            release-assets/*
          body_path: ${{ runner.temp }}/RELEASE_BODY.md
          generate_release_notes: true   # appends categorized "What's Changed" (see .github/release.yml)
          # Auto-open a repo-level Discussion linked to this release, seeded with
          # the same notes. Requires Discussions enabled and this category to exist.
          discussion_category_name: Announcements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mirror the release announcement into the ORG-level discussions, which are
      # backed by codellm-devkit/.github. GITHUB_TOKEN can't write cross-repo, so
      # this uses a PAT (ORG_DISCUSSIONS_TOKEN) with repo scope, and posts via the
      # createDiscussion GraphQL mutation. Reuses the already-composed RELEASE_BODY.md
      # so org and repo posts stay identical.
      - name: Announce in org-level discussions (codellm-devkit/.github)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true   # a failed org post must not fail an otherwise-good release
        env:
          GH_TOKEN: ${{ secrets.ORG_DISCUSSIONS_TOKEN }}
          VERSION: ${{ steps.tag_name.outputs.current_version }}
        run: |
          set -uo pipefail
          OWNER="codellm-devkit"; REPO=".github"; CATEGORY="Announcements"
          # The mutation needs GraphQL node IDs, not names — resolve them first.
          RESP=$(gh api graphql \
            -f query='query($o:String!,$r:String!){repository(owner:$o,name:$r){id discussionCategories(first:25){nodes{id name}}}}' \
            -f o="$OWNER" -f r="$REPO") \
            || { echo "::warning::org discussion lookup failed — skipping org announcement."; exit 0; }
          REPO_ID=$(echo "$RESP" | jq -r '.data.repository.id')
          CAT_ID=$(echo "$RESP" | jq -r --arg c "$CATEGORY" '.data.repository.discussionCategories.nodes[]|select(.name==$c)|.id')
          if [[ -z "$REPO_ID" || "$REPO_ID" == "null" || -z "$CAT_ID" ]]; then
            echo "::warning::could not resolve $OWNER/$REPO discussion category '$CATEGORY' — skipping org announcement."
            exit 0
          fi
          gh api graphql \
            -f query='mutation($rid:ID!,$cid:ID!,$t:String!,$b:String!){createDiscussion(input:{repositoryId:$rid,categoryId:$cid,title:$t,body:$b}){discussion{url}}}' \
            -f rid="$REPO_ID" -f cid="$CAT_ID" \
            -f t="codeanalyzer-python v$VERSION" \
            -f b="$(cat "$RUNNER_TEMP/RELEASE_BODY.md")"

      - name: Publish to PyPI via Trusted Publishing
        run: uv publish

  # Regenerate the Homebrew formula and push it to the shared tap. Split into its
  # own job (needs: release) so a tap-push failure -- e.g. a missing
  # HOMEBREW_TAP_TOKEN -- is isolated from the PyPI and GitHub Release steps above.
  # The non-Rust equivalent of what cargo-dist does for you.

      # Record this release's schema artifacts in the shared contract repo
      # (codellm-devkit/codeanalyzer-schema): the Neo4j graph contract, and the JSON
      # samples that repo documents as "unedited analyzer output on the analyzers' own
      # test fixtures". Delivered as a pull request rather than a push, so two analyzers
      # releasing close together cannot race and a contract change stays reviewable.
      #
      # The destination line is derived from the emitted `schema_version` rather than
      # hard-coded, and the two projections carry that version independently -- today
      # every analyzer reads 2.0.0 on both, so everything lands under v2/.
      - name: Record schemas in codeanalyzer-schema
        if: startsWith(github.ref, 'refs/tags/')
        env:
          # The org PAT already used for the cross-repo announcement in this workflow. It
          # needs contents:write plus pull-requests:write on codeanalyzer-schema; if this
          # step 403s, CLDK_AUTH_TOKEN is the PAT documented as carrying repo scope.
          GH_TOKEN: ${{ secrets.ORG_DISCUSSIONS_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          STAGE="$RUNNER_TEMP/schema-stage"
          WORK="$RUNNER_TEMP/schema-repo"
          mkdir -p "$STAGE"
          # Samples are unedited analyzer output on this repo's own fixtures, staged under
          # the exact filenames the contract repo keeps them under.
          LANG=python
          uv run canpy -i test/fixtures/whole_applications/manifests_app        -o "$STAGE/run-l4" -a 4 --no-venv --skip-tests --app-name manifests_app
          uv run canpy -i test/fixtures/single_functionalities/dataflow          -o "$STAGE/run-df" -a 4 --no-venv --skip-tests --app-name dataflow
          uv run canpy -i test/fixtures/single_functionalities/entrypoints_local -o "$STAGE/run-ep" -a 2 --no-venv --skip-tests --app-name entrypoints_local
          cp "$STAGE/run-l4/analysis.json" "$STAGE/analysis.l4.sample.json"
          cp "$STAGE/run-df/analysis.json" "$STAGE/analysis.dataflow.sample.json"
          cp "$STAGE/run-ep/analysis.json" "$STAGE/analysis.entrypoints.sample.json"
          uv run canpy --emit schema > "$STAGE/schema.neo4j.json"

          # One line per projection: analysis.json and the graph contract carry their
          # schema_version independently, so each destination is derived from its own document.
          JSON_LINE="v$(jq -r '.schema_version | split(".")[0]' "$STAGE/analysis.l4.sample.json")"
          NEO_LINE="v$(jq -r '.schema_version | split(".")[0]' "$STAGE/schema.neo4j.json")"
          echo "analysis.json -> $JSON_LINE/json/$LANG/ ; graph contract -> $NEO_LINE/neo4j/$LANG/"

          if ! git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/codellm-devkit/codeanalyzer-schema.git" "$WORK"; then
            echo "::error::cannot clone codeanalyzer-schema. Does ORG_DISCUSSIONS_TOKEN carry contents:write on it? CLDK_AUTH_TOKEN is the PAT documented with repo scope."
            exit 1
          fi

          mkdir -p "$WORK/$JSON_LINE/json/$LANG" "$WORK/$NEO_LINE/neo4j/$LANG"
          cp "$STAGE"/*.sample.json "$WORK/$JSON_LINE/json/$LANG/"
          cp "$STAGE/schema.neo4j.json" "$WORK/$NEO_LINE/neo4j/$LANG/schema.neo4j.json"

          cd "$WORK"
          BRANCH="uptake/$LANG-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "codeanalyzer-schema already records these artifacts; nothing to open."
            exit 0
          fi
          git commit -m "chore($LANG): record codeanalyzer-$LANG v${VERSION} schemas"
          if ! git push -f origin "$BRANCH"; then
            echo "::error::cannot push to codeanalyzer-schema. The token needs contents:write there."
            exit 1
          fi
          gh pr create --repo codellm-devkit/codeanalyzer-schema \
            --head "$BRANCH" --base main \
            --title "chore($LANG): record codeanalyzer-$LANG v${VERSION} schemas" \
            --body "Emitted by the codeanalyzer-$LANG v${VERSION} release workflow. Graph contract to \`$NEO_LINE/neo4j/$LANG/\`, JSON samples to \`$JSON_LINE/json/$LANG/\`; both paths come from the schema_version in the emitted documents rather than being hard-coded. The samples are unedited analyzer output on this analyzer's own test fixtures, the provenance that repo's README documents. Validate with \`python3 scripts/check.py\`." \
            || echo "::notice::a PR for $BRANCH already exists; its branch was updated in place."
  homebrew:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Generate Homebrew formula
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x packaging/homebrew/generate_formula.sh
          # The release job just published the sdist as a Release asset; hash the
          # exact bytes users will download so the formula checksum always matches.
          sdist="https://github.com/${REPO}/releases/download/v${VERSION}/codeanalyzer_python-${VERSION}.tar.gz"
          SHA256="$(curl -fLsS "$sdist" | shasum -a 256 | cut -d' ' -f1)"
          REPO="$REPO" VERSION="$VERSION" SHA256="$SHA256" \
            ./packaging/homebrew/generate_formula.sh > codeanalyzer-python.rb
          cat codeanalyzer-python.rb

      - name: Push formula to codellm-devkit/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}   # PAT with write access to homebrew-tap
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/codellm-devkit/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp codeanalyzer-python.rb tap/Formula/codeanalyzer-python.rb
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/codeanalyzer-python.rb
          git commit -m "codeanalyzer-python ${VERSION}" || { echo "no formula change"; exit 0; }
          git push

  # Open a tracking issue on the python-sdk (CLDK) consumer so its
  # codeanalyzer-python pin and integration can be brought up to this release.
  # The issue body is the CHANGELOG section for this version. Split into its own
  # job (needs: release) so a failure here -- e.g. a missing SDK_ISSUE_TOKEN --
  # is isolated from the PyPI and GitHub Release steps above. Issues are
  # repository-scoped (not branch-scoped), so this opens one on python-sdk.
  notify-python-sdk:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Pull the lines under "## [VERSION]" up to the next "## [" heading.
      - name: Extract changelog section for this release
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          {
            echo "A new \`codeanalyzer-python\` release (\`v${VERSION}\`) is published."
            echo "Update the \`codeanalyzer-python\` pin in this repo and adapt the"
            echo "integration to the changes below (see \`PyCodeanalyzer._run_analyzer\`)."
            echo
            awk -v ver="$VERSION" '
              $0 ~ ("^## \\[" ver "\\]") { f = 1; print; next }
              f && /^## \[/ { exit }
              f { print }
            ' CHANGELOG.md
          } > "$RUNNER_TEMP/sdk_issue.md"
          echo "----- issue body -----"; cat "$RUNNER_TEMP/sdk_issue.md"

      - name: Create incorporation issue in python-sdk
        env:
          # CLDK_AUTH_TOKEN is a PAT with repo + discussions scope, reused here for the
          # cross-repo issue write. The default GITHUB_TOKEN is scoped to this repo only
          # and cannot open issues cross-repo, mirroring HOMEBREW_TAP_TOKEN above.
          GH_TOKEN: ${{ secrets.CLDK_AUTH_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          gh issue create \
            --repo codellm-devkit/python-sdk \
            --title "Incorporate codeanalyzer-python v${VERSION}" \
            --body-file "$RUNNER_TEMP/sdk_issue.md"
